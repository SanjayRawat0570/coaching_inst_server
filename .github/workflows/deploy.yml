name: Deploy backend to Hugging Face Spaces (free)
# Needs two repo settings (GitHub -> Settings -> Secrets and variables -> Actions):
#   secret   HF_TOKEN  - a Hugging Face access token with "write" role
#   variable HF_SPACE  - the Space id, e.g. your-hf-username/smart-coaching
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push a snapshot to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # Push only the current tree as one commit: Spaces reject pushes whose
          # history contains binary files, and the Space doesn't need our history.
          git config --global user.email "deploy@github.com"
          git config --global user.name "GitHub Actions"
          git checkout --orphan hf-deploy
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-deploy:main
